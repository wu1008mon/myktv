            </div>
          `;

          row.querySelector(".track-vis-cb").onchange = (e) => {
            t.visible = e.target.checked;
            this.renderTimelineMinimap();
          };
          row.querySelector(".track-style-sel").onchange = (e) => {
            t.displayStyle = e.target.value;
          };
          row.querySelector(".track-role-sel").onchange = (e) => {
            t.role = e.target.value;
            t.visible = (t.role !== "accompaniment");
            // 主唱預設為主要實心，其餘預設為次要半透明
            t.displayStyle = (t.role === "lead") ? "primary" : "secondary";
            this.refreshTrackUI();
            this.renderTimelineMinimap();
          };
          this.trackListContainer.appendChild(row);
        });
      }

      refreshMixerUI() {
        if (!this.mixerTrackList) return;
        this.mixerTrackList.innerHTML = "";
        this.currentTracks.forEach((t) => {
          const row = document.createElement("div");
          row.style.cssText = "display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; background: #1e293b; border-radius: 8px; border: 1px solid #334155;";
          const volPercent = Math.round((t.volume ?? 1.0) * 100);
          
          let prefix = "🎹 伴奏: ";
          let color = "#38bdf8";
          if (t.role === "lead") { prefix = "🎤 主唱: "; color = "#f43f5e"; }
          else if (t.role === "harmony1" || t.role === "harmony") { prefix = "🎶 二部: "; color = "#f59e0b"; }
          else if (t.role === "harmony2") { prefix = "🎵 三部: "; color = "#10b981"; }
          else if (t.role === "harmony3") { prefix = "🎼 四部: "; color = "#8b5cf6"; }

          const instName = t.isDrum ? "🥁 Standard Drums" : (GM_INSTRUMENT_NAMES[t.program || 0] || "Piano");

          row.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <div>
                <span style="font-size: 12px; font-weight: bold; color: ${color};">
                  ${prefix}${t.name}
                </span>
                <span style="font-size: 10px; color: #94a3b8; margin-left: 6px;">(${instName})</span>
              </div>
              <div style="display: flex; align-items: center; gap: 8px;">
                <span class="vol-label font-mono" style="font-size: 11px; color: #fde047; min-width: 36px; text-align: right;">${volPercent}%</span>
                <button class="btn mute-toggle-btn" style="height: 24px; padding: 0 6px; font-size: 10px; color: ${t.muted ? '#f87171' : '#94a3b8'};">
                  ${t.muted ? "Mute" : "靜音"}
                </button>
              </div>
            </div>
            <input type="range" class="vol-slider" min="0" max="150" value="${volPercent}" style="width: 100%; cursor: pointer;">
          `;

          const slider = row.querySelector(".vol-slider");
          const label = row.querySelector(".vol-label");
          const muteBtn = row.querySelector(".mute-toggle-btn");

          slider.oninput = (e) => {
            const val = Number(e.target.value);
            t.volume = val / 100;
            label.textContent = val + "%";
          };

          muteBtn.onclick = () => {
            t.muted = !t.muted;
            muteBtn.style.color = t.muted ? "#f87171" : "#94a3b8";
            muteBtn.textContent = t.muted ? "Mute" : "靜音";
          };

          this.mixerTrackList.appendChild(row);
        });
      }

      setBpm(newBpm) {
        newBpm = Math.max(40, Math.min(280, Math.round(newBpm)));
        this.currentBpm = newBpm;
        this.playbackRate = this.currentBpm / this.originalBpm;
        if (this.bpmInputField) this.bpmInputField.value = this.currentBpm;

        // 尚未播放時隨時調整速度，即時換算總時長並刷新介面
        if (this.songDurationOriginal) {
          this.songDuration = this.songDurationOriginal / this.playbackRate;
          if (this.timeTotal) this.timeTotal.textContent = this.formatTime(this.songDuration);
        }

        // 即時重繪頂部時間軸微縮圖與進度
        this.renderTimelineMinimap();
        this.updateTimelineProgress();
      }

      loadPreset(key) {
        let presetData;
        if (key === "preset_twinkle") {
          this.originalBpm = 100;
          presetData = buildTwinkleNotes(this.originalBpm);
        } else if (key === "preset_ode") {
          this.originalBpm = 120;
          presetData = buildOdeNotes(this.originalBpm);
        } else {
          this.originalBpm = 110;
          presetData = buildBirthdayNotes(this.originalBpm);
        }

        this.currentTracks = [
          {
            id: "tr_main",
            name: "主唱 (Lead)",
            program: 0, // Grand Piano
            isDrum: false,
            role: "lead",
            displayStyle: "primary", // 🌟 主要顯示 (實心)
            visible: true,
            volume: 1.0,
            muted: false,
            notes: presetData.lead
          }
        ];

        // 若有內建和聲音軌
        if (presetData.harmony && presetData.harmony.length > 0) {
          this.currentTracks.push({
            id: "tr_harmony",
            name: "和聲 (Harmony)",
            program: 48, // String Ensemble
            isDrum: false,
            role: "harmony1",
            displayStyle: "secondary", // 🌫️ 次要顯示 (半透明)
            visible: true,
            volume: 0.8,
            muted: false,
            notes: presetData.harmony
          });
        }

        this.originalBpmDisplay.textContent = this.originalBpm;
        const last = presetData.lead[presetData.lead.length - 1];
        this.songDurationOriginal = last ? last.start + last.dur + 2.0 : 20;
        this.currentTime = 0;
        this.setBpm(this.originalBpm);
        this.refreshTrackUI();
      }

      loadCustomSong(s) {
        this.originalBpm = s.bpm || 120;
        this.originalBpmDisplay.textContent = this.originalBpm;
        
        if (s.tracks && s.tracks.length > 0) {
          this.currentTracks = s.tracks.map((t, idx) => ({
            ...t,
            program: t.program !== undefined ? t.program : 0,
            isDrum: !!t.isDrum,
            role: t.role || (idx === 0 ? "lead" : "accompaniment"),
            displayStyle: t.displayStyle || (idx === 0 ? "primary" : "secondary"),
            visible: t.visible !== undefined ? t.visible : (t.role === "lead" || idx === 0),
            volume: t.volume !== undefined ? t.volume : 1.0,
            notes: quantizeAndFillNotes(t.notes, this.originalBpm)
          }));
        } else if (s.notes) {
          this.currentTracks = [{
            id: "tr_custom",
            name: s.name,
            program: 0,
            isDrum: false,
            role: "lead",
            displayStyle: "primary",
            visible: true,
            volume: 1.0,
            muted: false,
            notes: quantizeAndFillNotes(s.notes, this.originalBpm)
          }];
        }

        let maxTime = 20;
        this.currentTracks.forEach(t => {
          if (t.notes.length) {
            const last = t.notes[t.notes.length - 1];
            if (last.start + last.dur + 2.0 > maxTime) maxTime = last.start + last.dur + 2.0;
          }
        });
        this.songDurationOriginal = maxTime;
        this.currentTime = 0;
        this.setBpm(this.originalBpm);
        this.presetSelect.value = "custom_" + s.id;
        this.refreshTrackUI();
      }

      initEvents() {
        // 空白鍵（Spacebar）快速切換播放/暫停
        window.addEventListener("keydown", (e) => {
          if (e.code === "Space" && e.target.tagName !== "INPUT") {
            e.preventDefault();
            this.togglePlay();
          }
        });

        // 麥克風啟動
        document.getElementById("startMicBtn").onclick = async () => {
          if (await this.pitchEngine.initMic()) {
            await this.audioEngine.init();
            document.getElementById("micPromptOverlay").style.display = "none";
          }
        };

        // 靈敏度
        document.getElementById("micSensitivitySelect").onchange = (e) => {
          this.pitchEngine.setSensitivity(e.target.value);
        };

        // 播放暫停
        this.playPauseBtn.onclick = () => this.togglePlay();
        document.getElementById("rewindBtn").onclick = () => {
          this.currentTime = 0;
          this.userTrail = [];
        };

        // 節拍器開關
        this.metronomeToggleBtn.onclick = () => {
          this.metronomeOn = !this.metronomeOn;
          this.metroStatusLabel.textContent = this.metronomeOn ? "開" : "關";
          this.metroStatusLabel.style.color = this.metronomeOn ? "#34d399" : "#94a3b8";
        };

        // 節拍器音量聯動 (頂部與混音器雙向同步)
        const updateMetroVol = (val) => {
          this.audioEngine.metronomeVolume = val / 100;
          this.metroVolumeSlider.value = val;
          this.metroVolValLabel.textContent = val + "%";
          if (this.mixerMetroVolSlider) this.mixerMetroVolSlider.value = val;
          if (this.mixerMetroVolLabel) this.mixerMetroVolLabel.textContent = val + "%";
        };

        this.metroVolumeSlider.oninput = (e) => updateMetroVol(Number(e.target.value));
        if (this.mixerMetroVolSlider) {
          this.mixerMetroVolSlider.oninput = (e) => updateMetroVol(Number(e.target.value));
        }

        // 倒數開關
        this.countInToggleBtn.onclick = () => {
          this.countInEnabled = !this.countInEnabled;
          this.countInStatusLabel.textContent = this.countInEnabled ? "開 (4拍)" : "關";
          this.countInStatusLabel.style.color = this.countInEnabled ? "#38bdf8" : "#94a3b8";
        };

        // BPM 微調（隨時可調，未播放亦立即響應）
        document.getElementById("speedDownBtn").onclick = () => this.setBpm(this.currentBpm - 2);
        document.getElementById("speedUpBtn").onclick = () => this.setBpm(this.currentBpm + 2);
        document.getElementById("speedDown5Btn").onclick = () => this.setBpm(this.currentBpm - 5);
        document.getElementById("speedUp5Btn").onclick = () => this.setBpm(this.currentBpm + 5);
        document.getElementById("origBpmBtn").onclick = () => this.setBpm(this.originalBpm);
        this.bpmInputField.oninput = (e) => this.setBpm(Number(e.target.value));
        this.bpmInputField.onchange = (e) => this.setBpm(Number(e.target.value));

        // 移調
        document.getElementById("transposeDown").onclick = () => {
          this.transpose--;
          document.getElementById("transposeVal").textContent = this.transpose > 0 ? "+" + this.transpose : this.transpose;
        };
        document.getElementById("transposeUp").onclick = () => {
          this.transpose++;
          document.getElementById("transposeVal").textContent = this.transpose > 0 ? "+" + this.transpose : this.transpose;
        };

        // 導音開關
        document.getElementById("leadMuteToggle").onclick = () => {
          this.audioEngine.isMuted = !this.audioEngine.isMuted;
          document.getElementById("leadMuteIcon").textContent = this.audioEngine.isMuted ? "🔇" : "🔊";
        };

        // 歌曲選擇
        this.presetSelect.onchange = async (e) => {
          const val = e.target.value;
          if (val.startsWith("custom_")) {
            const id = val.replace("custom_", "");
            const songs = await songDB.getAllSongs();
            const found = songs.find(s => s.id === id);
            if (found) this.loadCustomSong(found);
          } else {
            this.loadPreset(val);
          }
        };

        // 曲庫開關
        document.getElementById("openLibraryModalBtn").onclick = () => {
          this.refreshLibraryUI();
          this.libraryModal.classList.remove("hidden");
        };
        document.getElementById("closeLibraryModalBtn").onclick = () => this.libraryModal.classList.add("hidden");
        document.getElementById("closeLibraryModalBottomBtn").onclick = () => this.libraryModal.classList.add("hidden");

        // 音軌彈窗開關
        this.openTrackModalBtn.onclick = () => {
          this.refreshTrackUI();
          this.trackModal.classList.remove("hidden");
        };
        document.getElementById("closeTrackModalBtn").onclick = () => this.trackModal.classList.add("hidden");
        document.getElementById("closeTrackModalBottomBtn").onclick = () => this.trackModal.classList.add("hidden");

        // 混音器開關
        this.openMixerModalBtn.onclick = () => {
          this.refreshMixerUI();
          this.mixerModal.classList.remove("hidden");
        };
        document.getElementById("closeMixerModalBtn").onclick = () => this.mixerModal.classList.add("hidden");
        // 上傳 MIDI (含完整錯誤捕捉與狀態提示)
        document.getElementById("midiFileInput").onchange = async (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          try {
            const buf = await file.arrayBuffer();
            const parsed = SimpleMidiParser.parse(buf);
            if (!parsed.tracks || parsed.tracks.length === 0) {
              window.alert("此 MIDI 檔案中未偵測到任何音符，請確認是否為有效音軌！");
              return;
            }
            const songObj = {
              id: "song_" + Date.now(),
              name: file.name.replace(/\.[^/.]+$/, ""),
              bpm: parsed.bpm,
              tracks: parsed.tracks,
              savedAt: new Date().toLocaleDateString()
            };
            await songDB.saveSong(songObj);
            await this.refreshLibraryUI();
            this.loadCustomSong(songObj);
          } catch (err) {
            console.error("MIDI 解析失敗:", err);
            window.alert("讀取 MIDI 失敗：" + err.message);
          } finally {
            e.target.value = ""; // 清空以便再次選取同檔名
          }
        };

        // ================= 頂部小時間軸（支援手柄縮放、框體拖曳與滾輪） =================
        const timelineTrack = document.getElementById("timelineTrack");
        const vpBox = document.getElementById("timelineViewportBox");
        const handleL = document.getElementById("vpHandleL");
        const handleR = document.getElementById("vpHandleR");

        let dragMode = null; // 'pan', 'resizeL', 'resizeR'
        let dragStartX = 0;
        let startWinSec = 5.0;
        let startCurrTime = 0;

        handleL.addEventListener("mousedown", (e) => {
          e.stopPropagation();
          dragMode = "resizeL";
          dragStartX = e.clientX;
          startWinSec = this.viewWindowSeconds;
        });

        handleR.addEventListener("mousedown", (e) => {
          e.stopPropagation();
          dragMode = "resizeR";
          dragStartX = e.clientX;
          startWinSec = this.viewWindowSeconds;
        });

        vpBox.addEventListener("mousedown", (e) => {
          e.stopPropagation();
          dragMode = "pan";
          dragStartX = e.clientX;
          startCurrTime = this.currentTime;
        });

        timelineTrack.addEventListener("mousedown", (e) => {
          const rect = timelineTrack.getBoundingClientRect();
          const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
          this.currentTime = ratio * this.songDuration;
          dragMode = "pan";
          dragStartX = e.clientX;
          startCurrTime = this.currentTime;
        });

        window.addEventListener("mousemove", (e) => {
          if (!dragMode) return;
          const rect = timelineTrack.getBoundingClientRect();
          const deltaX = e.clientX - dragStartX;

          if (dragMode === "pan") {
            const timeDelta = (deltaX / rect.width) * this.songDuration;
            this.currentTime = Math.max(0, Math.min(this.songDuration, startCurrTime + timeDelta));
          } else if (dragMode === "resizeR") {
            const secDelta = (deltaX / rect.width) * this.songDuration;
            this.viewWindowSeconds = Math.max(2.0, Math.min(25.0, startWinSec + secDelta));
          } else if (dragMode === "resizeL") {
            const secDelta = -(deltaX / rect.width) * this.songDuration;
            this.viewWindowSeconds = Math.max(2.0, Math.min(25.0, startWinSec + secDelta));
          }
        });

        window.addEventListener("mouseup", () => {
          dragMode = null;
        });

        // 在頂部時間軸上滾輪：直接放大/縮小時間軸可視範圍
        timelineTrack.addEventListener("wheel", (e) => {
          e.preventDefault();
          const delta = e.deltaY > 0 ? 0.6 : -0.6;
          this.viewWindowSeconds = Math.max(2.0, Math.min(25.0, this.viewWindowSeconds + delta));
        }, { passive: false });

        // 主畫布觸控兩指捏合縮放（Pinch-to-zoom）與電腦滾輪縮放
        let initialPinchDist = null;
        let initialWindowSec = 5.0;

        this.canvas.addEventListener("touchstart", (e) => {
          if (e.touches.length === 2) {
            initialPinchDist = Math.abs(e.touches[0].clientX - e.touches[1].clientX);
            initialWindowSec = this.viewWindowSeconds;
          }
        }, { passive: true });

        this.canvas.addEventListener("touchmove", (e) => {
          if (e.touches.length === 2 && initialPinchDist) {
            const curDist = Math.abs(e.touches[0].clientX - e.touches[1].clientX);
            const scale = initialPinchDist / Math.max(10, curDist);
            this.viewWindowSeconds = Math.max(2.0, Math.min(25.0, initialWindowSec * scale));
          }
        }, { passive: true });

        this.canvas.addEventListener("touchend", () => {
          initialPinchDist = null;
        }, { passive: true });

        this.canvas.addEventListener("wheel", (e) => {
          e.preventDefault();
          const delta = e.deltaY > 0 ? 0.5 : -0.5;
          this.viewWindowSeconds = Math.max(2.0, Math.min(25.0, this.viewWindowSeconds + delta));
        }, { passive: false });
      }

      async togglePlay() {
        if (this.isPlaying) {
          // 暫停
          this.isPlaying = false;
          this.playIcon.textContent = "▶";
          this.playText.textContent = "播放 (Space)";
          this.playPauseBtn.className = "btn btn-primary";
        } else {
          await this.audioEngine.init();
          // 強制解鎖瀏覽器音訊輸出 (Autoplay Resume)
          if (this.audioEngine.ctx && this.audioEngine.ctx.state === "suspended") {
            await this.audioEngine.ctx.resume();
          }

          // 判斷是否需要 4 拍倒數
          if (this.countInEnabled && this.currentTime === 0 && !this.isCountingDown) {
            this.startCountIn();
          } else {
            this.startPlaying();
          }
        }
      }

      startCountIn() {
        this.isCountingDown = true;
        this.countDownStep = 4;
        this.countInOverlay.classList.remove("hidden");
        const beatInterval = (60 / this.currentBpm) * 1000;

        const countTick = () => {
          if (!this.isCountingDown) return;
          if (this.countDownStep > 0) {
            this.countInNumber.textContent = this.countDownStep;
            this.countInNumber.style.animation = "none";
            void this.countInNumber.offsetWidth; // 觸發重播動畫
            this.countInNumber.style.animation = "pulsePop 0.35s ease-out";

            // 響叮一聲
            this.audioEngine.playTick(this.countDownStep === 4);
            this.countDownStep--;
            setTimeout(countTick, beatInterval);
          } else {
            this.countInOverlay.classList.add("hidden");
            this.isCountingDown = false;
            this.startPlaying();
          }
        };
        countTick();
      }

      startPlaying() {
        this.isPlaying = true;
        this.playIcon.textContent = "⏸";
        this.playText.textContent = "暫停";
        this.playPauseBtn.className = "btn btn-amber";
        this.lastBeatIndex = -1;
        // 重設音符調度時間，防止切換播放時漏音或爆音
        this.lastScheduledTime = this.currentTime;
      }

      formatTime(sec) {
        const m = Math.floor(sec / 60).toString().padStart(2, "0");
        const s = Math.floor(sec % 60).toString().padStart(2, "0");
        return `${m}:${s}`;
      }

      resize() {
        this.canvas.width = this.canvas.clientWidth * window.devicePixelRatio;
        this.canvas.height = this.canvas.clientHeight * window.devicePixelRatio;
        this.timelineCanvas.width = this.timelineCanvas.clientWidth * window.devicePixelRatio;
        this.timelineCanvas.height = this.timelineCanvas.clientHeight * window.devicePixelRatio;
        this.renderTimelineMinimap();
      }

      renderTimelineMinimap() {
        const w = this.timelineCanvas.width;
        const h = this.timelineCanvas.height;
        this.tCtx.clearRect(0, 0, w, h);
        if (!this.currentTracks.length) return;

        this.currentTracks.forEach((t) => {
          if (!t.visible) return;
          this.tCtx.fillStyle = t.role === "lead" ? "rgba(244, 63, 94, 0.7)" : "rgba(234, 179, 8, 0.5)";
          t.notes.forEach((n) => {
            const x = (n.start / this.songDuration) * w;
            const nw = Math.max(2, (n.dur / this.songDuration) * w);
            const y = h - ((n.midi - this.minMidi) / (this.maxMidi - this.minMidi)) * h;
            this.tCtx.fillRect(x, y - 2, nw, 3.5);
          });
        });
      }

      renderLoop(timestamp) {
        if (!this.lastFrameTime) this.lastFrameTime = timestamp;
        const delta = (timestamp - this.lastFrameTime) / 1000;
        this.lastFrameTime = timestamp;

        if (this.isPlaying) {
          const prevTime = this.currentTime;
          this.currentTime += delta * this.playbackRate;

          // ================= 音樂音符發聲調度器 (Audio Note Scheduler) =================
          if (!this.audioEngine.isMuted) {
            this.currentTracks.forEach(track => {
              if (track.muted || track.volume <= 0) return;
              track.notes.forEach(note => {
                // 當音符起始時間正好落在本幀前進的區間內，立即發聲
                if (note.start >= prevTime && note.start < this.currentTime) {
                  const playMidi = track.isDrum ? note.midi : (note.midi + this.transpose);
                  this.audioEngine.playNote(
                    playMidi,
                    note.dur / this.playbackRate,
                    track.volume ?? 1.0,
                    track.program ?? 0,
                    track.isDrum
                  );
                }
              });
            });
          }
          // 獨立節拍器滴答運算（依據原始音樂秒數對應的真實拍速累計）
          if (this.metronomeOn) {
            // 由於 currentTime 是原始 MIDI 秒數，在原始時間中每拍長度為 (60 / this.originalBpm)
            const beatDurationOriginal = (60 / this.originalBpm);
            const currentBeat = Math.floor(this.currentTime / beatDurationOriginal);
            if (currentBeat !== this.lastBeatIndex) {
              this.lastBeatIndex = currentBeat;
              const isMeasureStart = (currentBeat % 4 === 0);
              this.audioEngine.playTick(isMeasureStart);
            }
          }

          if (this.currentTime >= this.songDuration) {
            this.currentTime = this.songDuration;
            this.togglePlay();
          }
        }

        const pitchData = this.pitchEngine.detect();

        // 麥克風視覺
        if (pitchData.rms > 0) {
          this.micLevelBar.style.width = Math.min(100, Math.round(pitchData.rms * 600)) + "%";
        } else {
          this.micLevelBar.style.width = "0%";
        }
        this.detectedPitchLabel.textContent = pitchData.note || "--";

        if (this.isPlaying && pitchData.midi) {
          this.userTrail.push({ time: this.currentTime, midi: pitchData.midi - this.transpose });
        }
        if (this.userTrail.length > 250) this.userTrail.shift();

        this.renderCanvas(pitchData);
        this.updateTimelineProgress();

        requestAnimationFrame((t) => this.renderLoop(t));
      }

      updateTimelineProgress() {
        const ratio = Math.min(1, Math.max(0, this.currentTime / this.songDuration));
        document.getElementById("timelineProgress").style.width = `${ratio * 100}%`;
        document.getElementById("timelineThumb").style.left = `${ratio * 100}%`;
        this.timeCurrent.textContent = this.formatTime(this.currentTime);

        // 更新頂部小時間軸的可視範圍取景框（Viewport Window）
        if (this.timelineViewportBox) {
          const pianoWidthRatio = 60 / Math.max(1, this.canvas.width);
          const leadTimeRatio = 0.22 * (1 - pianoWidthRatio);
          const startTime = Math.max(0, this.currentTime - this.viewWindowSeconds * leadTimeRatio);
          const boxLeftPercent = (startTime / this.songDuration) * 100;
          const boxWidthPercent = Math.min(100 - boxLeftPercent, (this.viewWindowSeconds / this.songDuration) * 100);

          this.timelineViewportBox.style.left = `${boxLeftPercent}%`;
          this.timelineViewportBox.style.width = `${Math.max(2, boxWidthPercent)}%`;
        }
      }

      renderCanvas(pitchData) {
        const w = this.canvas.width;
        const h = this.canvas.height;
        const ctx = this.ctx;
        ctx.clearRect(0, 0, w, h);

        const pianoWidth = 65; // 左側鋼琴琴鍵尺寬度
        const targetX = pianoWidth + (w - pianoWidth) * 0.22; // 唱針基準線位置
        const pixelsPerSecond = (w - pianoWidth) / this.viewWindowSeconds;

        const noteRange = this.maxMidi - this.minMidi; // 84 - 36 = 48 個半音 (C2 ~ C6)
        const rowHeight = h / noteRange;

        // ================= 1. 繪製背景水平音階軌道與男聲/女聲音域標記 =================
        // 計算男聲 (C2-C3: 36~48) 與女聲 (C4-C5: 60~72) 垂直區域
        const maleYTop = h - (48 - this.minMidi) * rowHeight;
        const maleYBottom = h - (36 - this.minMidi) * rowHeight;
        const femaleYTop = h - (72 - this.minMidi) * rowHeight;
        const femaleYBottom = h - (60 - this.minMidi) * rowHeight;

        // 男聲專用音域微透背景 (C2-C3)
        ctx.fillStyle = "rgba(14, 116, 144, 0.08)";
        ctx.fillRect(pianoWidth, maleYTop, w - pianoWidth, maleYBottom - maleYTop);

        // 女聲專用音域微透背景 (C4-C5)
        ctx.fillStyle = "rgba(236, 72, 153, 0.08)";
        ctx.fillRect(pianoWidth, femaleYTop, w - pianoWidth, femaleYBottom - femaleYTop);

        for (let m = this.minMidi; m <= this.maxMidi; m++) {
          const y = h - (m - this.minMidi) * rowHeight;
          const isBlack = [1, 3, 6, 8, 10].includes(m % 12);

          ctx.fillStyle = isBlack ? "rgba(9, 13, 22, 0.7)" : "rgba(15, 23, 42, 0.7)";
          ctx.fillRect(pianoWidth, y - rowHeight, w - pianoWidth, rowHeight);

          ctx.strokeStyle = isBlack ? "rgba(30, 41, 59, 0.35)" : "rgba(51, 65, 85, 0.22)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(pianoWidth, y);
          ctx.lineTo(w, y);
          ctx.stroke();
        }

        // ================= 2. 繪製拍子格線（Beat Grid & Measure Lines） =================
        // 格線精準對齊音樂音符的時間刻度 (以原始拍長為基準，隨跑道捲動完美吸附)
        const beatDuration = (60 / this.originalBpm);
        const startTimeInView = this.currentTime - (targetX - pianoWidth) / pixelsPerSecond;
        const endTimeInView = this.currentTime + (w - targetX) / pixelsPerSecond;

        const startBeat = Math.floor(startTimeInView / beatDuration);
        const endBeat = Math.ceil(endTimeInView / beatDuration);

        for (let b = startBeat; b <= endBeat; b++) {
          const beatTime = b * beatDuration;
          const lineX = targetX + (beatTime - this.currentTime) * pixelsPerSecond;

          if (lineX >= pianoWidth && lineX <= w) {
            const isMeasure = (b % 4 === 0);
            ctx.beginPath();
            ctx.moveTo(lineX, 0);
            ctx.lineTo(lineX, h);

            if (isMeasure) {
              // 4拍一小節實線
              ctx.strokeStyle = "rgba(56, 189, 248, 0.35)";
              ctx.lineWidth = 1.5;
              ctx.setLineDash([]);
              ctx.stroke();

              // 小節編號
              ctx.fillStyle = "rgba(56, 189, 248, 0.6)";
              ctx.font = "10px monospace";
              ctx.fillText(`${Math.floor(b / 4) + 1}`, lineX + 4, 14);
            } else {
              // 四分音符拍子虛線
              ctx.strokeStyle = "rgba(100, 116, 139, 0.22)";
              ctx.lineWidth = 1;
              ctx.setLineDash([4, 4]);
              ctx.stroke();
            }
          }
        }
        ctx.setLineDash([]);

        // ================= 3. 繪製音符光棒（支援主要實心 / 次要半透明 顏色切換） =================
        let currentTargetMidi = null;
        let activeNowLyric = ""; // 儲存當前正在唱的歌詞，供游標光點即時懸浮顯示

        this.currentTracks.forEach((track) => {
          if (!track.visible) return;
          const role = track.role;
          const isPrimary = (track.displayStyle !== "secondary"); // 是否為「主要顯示」

          // 基礎色彩分配
          let baseRgb = "244, 63, 94"; // 主唱 (粉紅)
          if (role === "harmony1" || role === "harmony") baseRgb = "245, 158, 11"; // 二部 (琥珀金)
          else if (role === "harmony2") baseRgb = "16, 185, 129"; // 三部 (翡翠綠)
          else if (role === "harmony3") baseRgb = "139, 92, 246"; // 四部 (紫羅蘭)
          else if (role === "accompaniment") baseRgb = "56, 189, 248"; // 伴奏 (天藍)

          // 核心樣式：主要顯示 100% 飽和實心 + 發光；次要顯示 35% 半透明柔化
          const noteFillColor = isPrimary ? `rgba(${baseRgb}, 0.95)` : `rgba(${baseRgb}, 0.35)`;
          const noteStrokeColor = isPrimary ? `rgba(${baseRgb}, 1.0)` : `rgba(${baseRgb}, 0.55)`;
          const glowColor = `rgba(${baseRgb}, ${isPrimary ? 0.8 : 0.2})`;

          track.notes.forEach((note) => {
            const noteMidi = note.midi + this.transpose;
            const startX = targetX + (note.start - this.currentTime) * pixelsPerSecond;
            const noteW = note.dur * pixelsPerSecond;
            const noteY = h - (noteMidi - this.minMidi) * rowHeight;

            if (startX + noteW > pianoWidth && startX < w) {
              const drawX = Math.max(pianoWidth, startX);
              const drawW = Math.max(4, startX + noteW - drawX);
              const barH = Math.max(12, rowHeight - 2);
              const barY = noteY - barH + (rowHeight - barH) / 2;

              // 是否為當前唱針判定目標
              const isHitNow = (this.currentTime >= note.start && this.currentTime <= note.start + note.dur);
              if (isHitNow) {
                if (role === "lead" || isPrimary) {
                  currentTargetMidi = noteMidi;
                  if (note.lyric && note.lyric.trim()) {
                    activeNowLyric = note.lyric.trim();
                  }
                }
              }

              // 繪製光棒
              ctx.save();
              if (isPrimary) {
                ctx.shadowColor = glowColor;
                ctx.shadowBlur = isHitNow ? 16 : 8;
              } else {
                ctx.shadowBlur = 0; // 次要半透明軌道不擴散刺眼光暈
              }

              ctx.fillStyle = noteFillColor;
              ctx.beginPath();
              const radius = Math.min(5, barH / 2, drawW / 2);
              if (ctx.roundRect) {
                ctx.roundRect(drawX, barY, drawW, barH, radius);
              } else {
                ctx.rect(drawX, barY, drawW, barH);
              }
              ctx.fill();

              ctx.strokeStyle = noteStrokeColor;
              ctx.lineWidth = isPrimary ? 1.5 : 1;
              ctx.stroke();
              ctx.restore();

              // 頂部立體反光
              ctx.fillStyle = isPrimary ? "rgba(255, 255, 255, 0.25)" : "rgba(255, 255, 255, 0.08)";
              ctx.fillRect(drawX + radius, barY + 1, Math.max(0, drawW - radius * 2), Math.max(2, barH * 0.25));

              // 歌詞與音名
              const hasLyric = note.lyric && note.lyric.trim().length > 0;
              if (hasLyric) {
                ctx.save();
                const lyricFontSize = Math.min(22, Math.max(15, Math.round(barH * 1.05)));
                ctx.font = `bold ${lyricFontSize}px -apple-system, 'Microsoft YaHei', 'PingFang TC', sans-serif`;
                ctx.textBaseline = "middle";

                const textMetric = ctx.measureText(note.lyric);
                const textWidth = textMetric.width;
                const canFitInside = (drawW >= textWidth + 8);

                let textDrawX = drawX + 6;
                let textDrawY = barY + barH / 2;

                if (!canFitInside) {
                  textDrawX = drawX + Math.max(0, (drawW - textWidth) / 2);
                  textDrawY = barY - (lyricFontSize / 2 + 2);
                }

                ctx.strokeStyle = "rgba(0, 0, 0, 0.9)";
                ctx.lineWidth = 3.5;
                ctx.lineJoin = "round";
                ctx.strokeText(note.lyric, textDrawX, textDrawY);

                ctx.fillStyle = isPrimary ? "#ffffff" : "rgba(255, 255, 255, 0.85)";
                ctx.fillText(note.lyric, textDrawX, textDrawY);
                ctx.restore();
              }
            }
          });
        });

        // ================= 4. 繪製使用者歌聲軌跡（Pitch Trail） =================
        if (this.userTrail.length > 1) {
          ctx.save();
          ctx.strokeStyle = "#38bdf8";
          ctx.lineWidth = 3.5;
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.shadowColor = "#06b6d4";
          ctx.shadowBlur = 10;
          ctx.beginPath();
          let started = false;

          for (let i = 0; i < this.userTrail.length; i++) {
            const pt = this.userTrail[i];
            const px = targetX + (pt.time - this.currentTime) * pixelsPerSecond;
            const py = h - (pt.midi - this.minMidi) * rowHeight;
            if (px >= pianoWidth && px <= targetX) {
              if (!started) { ctx.moveTo(px, py); started = true; }
              else ctx.lineTo(px, py);
            }
          }
          if (started) ctx.stroke();
          ctx.restore();
        }

        // ================= 5. 繪製垂直唱針基準線與當前歌詞氣泡 (Current Lyric Bubble) =================
        ctx.strokeStyle = "rgba(56, 189, 248, 0.85)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(targetX, 0);
        ctx.lineTo(targetX, h);
        ctx.stroke();

        let userY = null;
        if (pitchData && pitchData.midi) {
          const userMidi = pitchData.midi - this.transpose;
          userY = h - (userMidi - this.minMidi) * rowHeight;

          let isMatch = false;
          if (currentTargetMidi !== null) {
            const diff = Math.abs(userMidi - currentTargetMidi);
            if (diff <= 0.65) {
              isMatch = true;
              this.score += 2;
              this.combo += 1;
              this.scoreDisplay.textContent = this.score;
              this.comboDisplay.textContent = this.combo;
            } else {
              this.combo = 0;
              this.comboDisplay.textContent = "0";
            }
          }

          // 繪製唱歌即時指示光球
          ctx.save();
          ctx.fillStyle = isMatch ? "#fde047" : "#38bdf8";
          ctx.shadowColor = isMatch ? "#fde047" : "#0284c7";
          ctx.shadowBlur = isMatch ? 20 : 12;
          ctx.beginPath();
          ctx.arc(targetX, userY, isMatch ? 9 : 7, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.arc(targetX, userY, 3.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // 🌟 亮點功能：在唱針光點正上方懸浮「當下要唱的歌詞氣泡」
        if (activeNowLyric) {
          ctx.save();
          const bubbleY = userY !== null ? Math.max(30, userY - 26) : (h * 0.45);
          ctx.font = "bold 22px -apple-system, 'Microsoft YaHei', 'PingFang TC', sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";

          const textWidth = ctx.measureText(activeNowLyric).width;
          const boxPadding = 10;
          const boxW = Math.max(38, textWidth + boxPadding * 2);
          const boxH = 32;

          // 氣泡背景框
          ctx.fillStyle = "rgba(15, 23, 42, 0.92)";
          ctx.strokeStyle = "#ec4899";
          ctx.lineWidth = 2;
          ctx.shadowColor = "rgba(236, 72, 153, 0.6)";
          ctx.shadowBlur = 12;

          if (ctx.roundRect) {
            ctx.beginPath();
            ctx.roundRect(targetX - boxW / 2, bubbleY - boxH / 2, boxW, boxH, 8);
            ctx.fill();
            ctx.stroke();
          } else {
            ctx.fillRect(targetX - boxW / 2, bubbleY - boxH / 2, boxW, boxH);
            ctx.strokeRect(targetX - boxW / 2, bubbleY - boxH / 2, boxW, boxH);
          }

          // 氣泡文字
          ctx.fillStyle = "#fde047";
          ctx.fillText(activeNowLyric, targetX, bubbleY);
          ctx.restore();
        }

        // ================= 6. 繪製左側立體鋼琴琴鍵尺規 (C2 ~ C6 音域與男女聲標籤) =================
        ctx.save();
        ctx.fillStyle = "#090d16";
        ctx.fillRect(0, 0, pianoWidth, h);

        for (let m = this.minMidi; m <= this.maxMidi; m++) {
          const y = h - (m - this.minMidi) * rowHeight;
          const isBlack = [1, 3, 6, 8, 10].includes(m % 12);
          const isC = (m % 12 === 0);
          const octave = Math.floor(m / 12) - 1;

          // 琴鍵背景
          if (isBlack) {
            ctx.fillStyle = "#1e293b";
            ctx.fillRect(0, y - rowHeight, pianoWidth * 0.66, rowHeight);
            ctx.fillStyle = "#0f172a";
            ctx.fillRect(0, y - rowHeight + 1, pianoWidth * 0.63, rowHeight - 2);
          } else {
            ctx.fillStyle = "#334155";
            ctx.fillRect(0, y - rowHeight, pianoWidth, 1);
          }

          // 當前唱到的音在琴鍵上即時高亮
          if (pitchData && pitchData.roundedMidi && (pitchData.roundedMidi - this.transpose) === m) {
            ctx.fillStyle = "rgba(56, 189, 248, 0.65)";
            ctx.fillRect(0, y - rowHeight, pianoWidth, rowHeight);
          }

          // C 音標記（C2, C3, C4, C5, C6）
          if (isC) {
            const isMiddleC = (octave === 4); // C4 中央 C
            ctx.fillStyle = isMiddleC ? "#f43f5e" : "#38bdf8";
            ctx.font = "bold 11px monospace";
            ctx.textBaseline = "middle";
            ctx.fillText(`C${octave}`, 6, y - rowHeight / 2);

            // C2/C3 男聲標識、C4/C5 女聲標識
            ctx.font = "8px sans-serif";
            if (octave === 2) {
              ctx.fillStyle = "#06b6d4";
              ctx.fillText("男低", 28, y - rowHeight / 2);
            } else if (octave === 3) {
              ctx.fillStyle = "#38bdf8";
              ctx.fillText("男聲", 28, y - rowHeight / 2);
            } else if (octave === 4) {
              ctx.fillStyle = "#ec4899";
              ctx.fillText("女中", 28, y - rowHeight / 2);
            } else if (octave === 5) {
              ctx.fillStyle = "#f472b6";
              ctx.fillText("女高", 28, y - rowHeight / 2);
            }

            // C4 中央 C 向右延伸一條更鮮明的基準紅/藍引導線
            ctx.strokeStyle = isMiddleC ? "rgba(244, 63, 94, 0.45)" : "rgba(56, 189, 248, 0.25)";
            ctx.lineWidth = isMiddleC ? 1.5 : 1;
            ctx.beginPath();
            ctx.moveTo(pianoWidth, y);
            ctx.lineTo(w, y);
            ctx.stroke();
          }
        }

        // 琴鍵右側分界線
        ctx.strokeStyle = "rgba(51, 65, 85, 0.9)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(pianoWidth, 0);
        ctx.lineTo(pianoWidth, h);
        ctx.stroke();
        ctx.restore();
      }
    }

    // 啟動應用程式
    window.addEventListener("DOMContentLoaded", () => {
      window.app = new KTVApp();
    });
  </script>
</body>
</html>
