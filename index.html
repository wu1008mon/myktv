<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Web KTV Pitch Game (離線版)</title>
  
  <!-- 徹底移除任何外部 Tailwind CDN 依賴，使用 100% 內嵌 CSS，杜絕斷網或 CDN 失效導致的文字排版崩潰 -->
  <style>
    /* ================================= 基礎與重置樣式 ================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020617;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    /* ================================= 佈局結構 ================================= */
    #appRoot {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* 頂部整合控制列 */
    header.ktv-header {
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid rgba(51, 65, 85, 0.8);
      padding: 6px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
      z-index: 30;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .top-bar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .btn-scroll-row {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
      padding: 2px 0;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .btn-scroll-row::-webkit-scrollbar { display: none; }

    /* ================================= UI 元件與按鈕風格 ================================= */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 32px;
      padding: 0 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      outline: none;
      flex-shrink: 0;
      transition: all 0.15s ease;
      background: #1e293b;
      color: #e2e8f0;
      border-color: #334155;
    }
    .btn:active { transform: scale(0.95); }

    .btn-primary {
      background: #ec4899;
      color: #fff;
      border-color: #f472b6;
      box-shadow: 0 0 10px rgba(236, 72, 153, 0.4);
    }
    .btn-primary:hover { background: #f43f5e; }

    .btn-amber {
      background: #f59e0b;
      color: #fff;
      border-color: #fbbf24;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
    }

    .btn-indigo {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      border-color: #818cf8;
    }

    .select-dark {
      height: 32px;
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 0 10px;
      font-size: 11px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      flex-shrink: 0;
    }
    .select-dark:focus { border-color: #ec4899; }

    /* 速度微調輸入與標籤 */
    .bpm-box {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 2px 6px;
      height: 32px;
      flex-shrink: 0;
    }
    .bpm-box input {
      width: 44px;
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 4px;
      color: #38bdf8;
      text-align: center;
      font-weight: bold;
      font-size: 11px;
      outline: none;
    }

    /* 頂部時間軸微縮圖 */
    #timelineContainer {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 52px;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid rgba(51, 65, 85, 0.9);
      z-index: 10;
      display: flex;
      align-items: center;
      cursor: pointer;
    }
    #timelineTrack {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #timelineCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #timelineProgress {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 0%;
      background: rgba(6, 182, 212, 0.18);
      border-right: 2px solid #06b6d4;
      pointer-events: none;
    }
    #timelineThumb {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 6px;
      margin-left: -3px;
      background: #38bdf8;
      box-shadow: 0 0 10px #06b6d4;
      pointer-events: none;
    }

    /* 主畫布 */
    #mainView {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020617;
    }
    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 倒數動畫覆蓋層 */
    #countInOverlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 25;
      background: rgba(2, 6, 23, 0.4);
      backdrop-filter: blur(2px);
      transition: opacity 0.2s ease;
    }
    #countInOverlay.hidden { display: none; }
    #countInNumber {
      font-size: 88px;
      font-weight: 900;
      font-style: italic;
      color: #38bdf8;
      text-shadow: 0 0 30px rgba(56, 189, 248, 0.8), 0 0 60px rgba(56, 189, 248, 0.4);
      transform: scale(1);
      animation: pulsePop 0.4s ease-out;
    }
    #countInSub {
      font-size: 14px;
      color: #cbd5e1;
      letter-spacing: 2px;
      margin-top: 8px;
      font-weight: 700;
    }

    @keyframes pulsePop {
      0% { transform: scale(0.6); opacity: 0; }
      50% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* 彈窗樣式 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(5px);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.hidden { display: none; }
    .modal-dialog {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 16px;
      width: 100%;
      max-width: 520px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
    }
    .modal-header {
      padding: 14px 18px;
      border-bottom: 1px solid #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-body {
      padding: 14px 18px;
      overflow-y: auto;
      flex: 1;
    }
    .modal-footer {
      padding: 10px 18px;
      border-top: 1px solid #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.6);
    }
  </style>
</head>
<body>
  <div id="appRoot">

    <!-- =============================== 頂部控制列（所有功能居頂） =============================== -->
    <header class="ktv-header">
      <!-- 第一行：品牌、麥克風、節拍指示、評分 -->
      <div class="top-bar-row">
        <div style="display: flex; align-items: center; gap: 8px;">
          <div style="width: 26px; height: 26px; border-radius: 6px; background: linear-gradient(135deg, #ec4899, #f43f5e); display: flex; align-items: center; justify-content: center; font-size: 13px;">
            🎤
          </div>
          <div>
            <div style="font-size: 12px; font-weight: 800; display: flex; align-items: center; gap: 6px;">
              <span>KTV PITCH MASTER</span>
              <span style="font-size: 9px; padding: 1px 4px; background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.4); color: #34d399; border-radius: 4px;">純離線版</span>
            </div>
          </div>
        </div>

        <!-- 麥克風音量與偵測 -->
        <div style="display: flex; align-items: center; gap: 6px; background: #1e293b; padding: 3px 8px; border-radius: 8px; border: 1px solid #334155;">
          <button id="micToggleBtn" style="border: none; background: #ec4899; color: white; width: 20px; height: 20px; border-radius: 4px; font-size: 10px; cursor: pointer;">🎤</button>
          <div style="width: 50px; height: 6px; background: #090d16; border-radius: 4px; overflow: hidden;">
            <div id="micLevelBar" style="width: 0%; height: 100%; background: #34d399; transition: width 0.08s;"></div>
          </div>
          <span id="detectedPitchLabel" class="font-mono" style="font-size: 11px; font-weight: bold; color: #34d399; min-width: 28px; text-align: center;">--</span>

          <select id="micSensitivitySelect" class="select-dark" style="height: 24px; padding: 0 4px; font-size: 10px;">
            <option value="ultra">🎤 超靈敏 (微音)</option>
            <option value="high" selected>🎤 高靈敏 (推薦)</option>
            <option value="medium">🎤 一般</option>
            <option value="low">🎤 低靈敏</option>
          </select>
        </div>

        <!-- 計分與連擊 -->
        <div style="display: flex; align-items: center; gap: 8px;" class="font-mono">
          <div style="text-align: right;">
            <div style="font-size: 8px; color: #94a3b8;">SCORE</div>
            <div id="scoreDisplay" style="font-size: 12px; font-weight: bold; color: #fde047;">0</div>
          </div>
          <div style="width: 1px; height: 16px; background: #334155;"></div>
          <div style="text-align: right;">
            <div style="font-size: 8px; color: #94a3b8;">COMBO</div>
            <div id="comboDisplay" style="font-size: 12px; font-weight: bold; color: #f472b6;">0</div>
          </div>
        </div>
      </div>

      <!-- 第二行：操作工具按鈕列（橫向滑動） -->
      <div class="btn-scroll-row">
        <!-- 播放/暫停 (支援空白鍵) -->
        <button id="playPauseBtn" class="btn btn-primary">
          <span id="playIcon">▶</span>
          <span id="playText">播放 (Space)</span>
        </button>

        <button id="rewindBtn" class="btn" title="重頭開始">⏮</button>

        <!-- 時間 -->
        <div class="font-mono" style="font-size: 11px; color: #94a3b8; padding: 0 4px;">
          <span id="timeCurrent" style="color: #f8fafc; font-weight: 600;">00:00</span>
          <span>/</span>
          <span id="timeTotal">00:00</span>
        </div>

        <div style="width: 1px; height: 18px; background: #334155; flex-shrink: 0;"></div>

        <!-- 獨立節拍器按鈕與音量控制 -->
        <div style="display: flex; align-items: center; gap: 4px; background: #1e293b; padding: 2px 6px; border-radius: 8px; border: 1px solid #334155; height: 32px; flex-shrink: 0;">
          <button id="metronomeToggleBtn" class="btn" style="height: 24px; padding: 0 6px; border: none; background: transparent;" title="節拍器開關">
            <span>⏱️ 節拍:</span>
            <span id="metroStatusLabel" style="color: #94a3b8;">關</span>
          </button>
          <input type="range" id="metroVolumeSlider" min="0" max="150" value="80" style="width: 48px; cursor: pointer;" title="節拍器音量">
          <span id="metroVolValLabel" class="font-mono" style="font-size: 9px; color: #fde047; min-width: 26px;">80%</span>
        </div>

        <!-- 預備拍倒數按鈕 -->
        <button id="countInToggleBtn" class="btn" title="預備拍倒數開關">
          <span>⏳ 倒數:</span>
          <span id="countInStatusLabel" style="color: #38bdf8; font-weight: bold;">開 (4拍)</span>
        </button>

        <!-- 載入 MIDI -->
        <label class="btn btn-indigo">
          <span>📁 載入 MIDI</span>
          <input type="file" id="midiFileInput" accept=".mid,.midi" style="display: none;">
        </label>

        <!-- 歌曲選單 -->
        <select id="presetSelect" class="select-dark" style="max-width: 150px;">
          <optgroup label="📂 本機保存曲庫" id="customSongGroup"></optgroup>
          <optgroup label="🎵 內建完整填拍曲目">
            <option value="preset_twinkle">小星星 (Twinkle)</option>
            <option value="preset_ode">歡樂頌 (Ode to Joy)</option>
            <option value="preset_birthday">生日快樂 (Birthday)</option>
          </optgroup>
        </select>

        <!-- 音軌管理按鈕 -->
        <button id="openTrackModalBtn" class="btn" style="border-color: rgba(56,189,248,0.4); color: #38bdf8;" title="選擇與配置音軌">
          <span>🎼 歌唱音軌</span>
          <span id="trackCountBadge" style="background: rgba(56,189,248,0.25); padding: 0 4px; border-radius: 9999px; font-size: 9px;">1</span>
        </button>

        <!-- 混音器按鈕 -->
        <button id="openMixerModalBtn" class="btn" style="border-color: rgba(168,85,247,0.4); color: #c084fc;" title="調整各軌音量關係">
          <span>🎚️ 混音器</span>
        </button>

        <button id="openLibraryModalBtn" class="btn" style="border-color: rgba(236,72,153,0.4); color: #f472b6;">
          <span>📚 曲庫</span>
          <span id="libraryCountBadge" style="background: rgba(236,72,153,0.25); padding: 0 4px; border-radius: 9999px; font-size: 9px;">0</span>
        </button>

        <!-- 移調 -->
        <div style="display: flex; align-items: center; gap: 3px; background: #1e293b; padding: 0 6px; border-radius: 8px; border: 1px solid #334155; height: 32px;">
          <span style="font-size: 10px; color: #94a3b8;">調:</span>
          <button id="transposeDown" class="btn" style="height: 22px; width: 22px; padding: 0;">-</button>
          <span id="transposeVal" class="font-mono" style="font-size: 11px; font-weight: bold; color: #f472b6; width: 18px; text-align: center;">0</span>
          <button id="transposeUp" class="btn" style="height: 22px; width: 22px; padding: 0;">+</button>
        </div>

        <!-- BPM 精確拍速控制 -->
        <div class="bpm-box">
          <button id="origBpmBtn" style="border: none; background: #090d16; color: #fde047; font-size: 10px; font-weight: bold; border-radius: 4px; padding: 2px 5px; cursor: pointer;" title="點擊還原原速">
            原速:<span id="originalBpmDisplay">120</span>
          </button>
          <button id="speedDown5Btn" class="btn" style="height: 24px; padding: 0 4px; font-size: 9px;">-5</button>
          <button id="speedDownBtn" class="btn" style="height: 24px; width: 24px; padding: 0;">-</button>
          <input type="number" id="bpmInputField" value="120" min="40" max="280">
          <span style="font-size: 9px; color: #94a3b8;">BPM</span>
          <button id="speedUpBtn" class="btn" style="height: 24px; width: 24px; padding: 0;">+</button>
          <button id="speedUp5Btn" class="btn" style="height: 24px; padding: 0 4px; font-size: 9px;">+5</button>
        </div>

        <!-- 導音 -->
        <button id="leadMuteToggle" class="btn">
          <span id="leadMuteIcon">🔊</span>
          <span>導音</span>
        </button>
      </div>
    </header>

    <!-- =============================== 主可視區（畫布、鋼琴鍵尺規、時間軸） =============================== -->
    <main id="mainView">
      <!-- 頂部微縮時間軸 -->
      <div id="timelineContainer">
        <div id="timelineTrack">
          <canvas id="timelineCanvas"></canvas>
          <div id="timelineProgress"></div>
          <!-- 支援縮放與拖曳的可視區域取景框 -->
          <div id="timelineViewportBox" style="position: absolute; top: 0; bottom: 0; left: 0; width: 25%; background: rgba(56, 189, 248, 0.15); border: 1.5px solid #38bdf8; border-radius: 4px; box-shadow: 0 0 8px rgba(56, 189, 248, 0.3); cursor: grab; z-index: 15;">
            <div id="vpHandleL" style="position: absolute; left: 0; top: 0; bottom: 0; width: 10px; background: #38bdf8; cursor: ew-resize; border-radius: 2px 0 0 2px;"></div>
            <div id="vpHandleR" style="position: absolute; right: 0; top: 0; bottom: 0; width: 10px; background: #38bdf8; cursor: ew-resize; border-radius: 0 2px 2px 0;"></div>
          </div>
          <div id="timelineThumb"></div>
        </div>
      </div>

      <!-- 遊戲畫布 -->
      <canvas id="gameCanvas"></canvas>

      <!-- 預備拍倒數動畫層 -->
      <div id="countInOverlay" class="hidden">
        <div id="countInNumber">4</div>
        <div id="countInSub">預備拍 · 請做好準備</div>
      </div>

      <!-- 麥克風提示覆蓋層 -->
      <div id="micPromptOverlay" style="position: absolute; inset: 0; background: rgba(2, 6, 23, 0.85); display: flex; align-items: center; justify-content: center; z-index: 40;">
        <div style="background: #0f172a; border: 1px solid #334155; border-radius: 16px; padding: 24px; text-align: center; max-width: 340px; margin: 16px;">
          <div style="font-size: 36px; margin-bottom: 12px;">🎤</div>
          <h3 style="font-size: 15px; font-weight: bold; margin-bottom: 6px;">點擊啟用麥克風以開始練唱</h3>
          <p style="font-size: 11px; color: #94a3b8; line-height: 1.5; margin-bottom: 18px;">
            音準完全在本地即時運算，不上傳雲端，零流量、超低延遲！
          </p>
          <button id="startMicBtn" class="btn btn-primary" style="width: 100%; height: 38px; font-size: 13px;">
            開始練唱
          </button>
        </div>
      </div>
    </main>

    <!-- =============================== 曲庫管理彈窗 =============================== -->
    <div id="libraryModal" class="modal-backdrop hidden">
      <div class="modal-dialog">
        <div class="modal-header">
          <div style="font-size: 13px; font-weight: bold;">📚 本機曲庫管理</div>
          <button id="closeLibraryModalBtn" style="background: none; border: none; color: #94a3b8; font-size: 18px; cursor: pointer;">✕</button>
        </div>
        <div class="modal-body" id="libraryListContainer" style="display: flex; flex-direction: column; gap: 8px;"></div>
        <div class="modal-footer">
          <span style="font-size: 10px; color: #64748b;">永久保存在此裝置的快閃記憶體中</span>
          <button id="closeLibraryModalBottomBtn" class="btn">關閉</button>
        </div>
      </div>
    </div>

    <!-- =============================== 音軌分配與顯示彈窗 =============================== -->
    <div id="trackModal" class="modal-backdrop hidden">
      <div class="modal-dialog">
        <div class="modal-header">
          <div style="font-size: 13px; font-weight: bold;">🎼 歌唱音軌定義與畫面顯示</div>
          <button id="closeTrackModalBtn" style="background: none; border: none; color: #94a3b8; font-size: 18px; cursor: pointer;">✕</button>
        </div>
        <div class="modal-body" id="trackListContainer" style="display: flex; flex-direction: column; gap: 8px;"></div>
        <div class="modal-footer">
          <span style="font-size: 10px; color: #64748b;">💡 預設僅顯示定義為「歌唱軌」的音符，其餘伴奏軌在畫面上自動隱藏</span>
          <button id="closeTrackModalBottomBtn" class="btn">完成</button>
        </div>
      </div>
    </div>

    <!-- =============================== 混音器彈窗 (Mixer) =============================== -->
    <div id="mixerModal" class="modal-backdrop hidden">
      <div class="modal-dialog">
        <div class="modal-header">
          <div style="font-size: 13px; font-weight: bold;">🎚️ 軌道混音器 (Mixer)</div>
          <button id="closeMixerModalBtn" style="background: none; border: none; color: #94a3b8; font-size: 18px; cursor: pointer;">✕</button>
        </div>
        <div class="modal-body" id="mixerListContainer" style="display: flex; flex-direction: column; gap: 10px;">
          <!-- 節拍器專用音量卡片 -->
          <div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; background: #1e293b; border-radius: 8px; border: 1px solid #38bdf8;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <div>
                <span style="font-size: 12px; font-weight: bold; color: #38bdf8;">⏱️ 節拍器 (Metronome)</span>
              </div>
              <span id="mixerMetroVolLabel" class="font-mono" style="font-size: 11px; color: #fde047;">80%</span>
            </div>
            <input type="range" id="mixerMetroVolSlider" min="0" max="150" value="80" style="width: 100%; cursor: pointer;">
          </div>
          <div id="mixerTrackList" style="display: flex; flex-direction: column; gap: 10px;"></div>
        </div>
        <div class="modal-footer">
          <button id="resetMixerBtn" class="btn" style="font-size: 10px;">全部重設 (100%)</button>
          <button id="closeMixerModalBottomBtn" class="btn btn-primary">確定</button>
        </div>
      </div>
    </div>

  </div>

  <!-- =============================== JavaScript 核心邏輯 =============================== -->
  <script>
    /* ==========================================================================
       1. IndexedDB 本機資料庫
       ========================================================================== */
    class SongDatabase {
      constructor() {
        this.dbName = "WebKTV_Database";
        this.storeName = "midi_songs";
        this.db = null;
      }
      async init() {
        return new Promise((resolve) => {
          const req = indexedDB.open(this.dbName, 1);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(this.storeName)) {
              db.createObjectStore(this.storeName, { keyPath: "id" });
            }
          };
          req.onsuccess = (e) => { this.db = e.target.result; resolve(this.db); };
          req.onerror = () => resolve(null);
        });
      }
      async saveSong(song) {
        if (!this.db) await this.init();
        return new Promise((resolve) => {
          try {
            const tx = this.db.transaction([this.storeName], "readwrite");
            tx.objectStore(this.storeName).put(song);
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => resolve(false);
          } catch { resolve(false); }
        });
      }
      async getAllSongs() {
        if (!this.db) await this.init();
        return new Promise((resolve) => {
          try {
            const tx = this.db.transaction([this.storeName], "readonly");
            const req = tx.objectStore(this.storeName).getAll();
            req.onsuccess = () => resolve(req.result || []);
            req.onerror = () => resolve([]);
          } catch { resolve([]); }
        });
      }
      async deleteSong(id) {
        if (!this.db) await this.init();
        return new Promise((resolve) => {
          try {
            const tx = this.db.transaction([this.storeName], "readwrite");
            tx.objectStore(this.storeName).delete(id);
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => resolve(false);
          } catch { resolve(false); }
        });
      }
    }
    const songDB = new SongDatabase();

    /* ==========================================================================
       2. 極速音高偵測（抗抖動 YIN + 3 幀中位數）
       ========================================================================== */
    class FastPitchEngine {
      constructor() {
        this.audioCtx = null;
        this.analyser = null;
        this.gainNode = null;
        this.buffer = new Float32Array(1024);
        this.pitchHistory = [];
        this.currentPitch = null;
        this.rms = 0;
        this.threshold = 0.18;
        this.rmsThreshold = 0.005;
      }
      async initMic() {
        try {
          this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (this.audioCtx.state === "suspended") await this.audioCtx.resume();
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
          });
          const src = this.audioCtx.createMediaStreamSource(stream);
          this.gainNode = this.audioCtx.createGain();
          this.gainNode.gain.value = 2.6;
          this.analyser = this.audioCtx.createAnalyser();
          this.analyser.fftSize = 1024;
          src.connect(this.gainNode);
          this.gainNode.connect(this.analyser);
          return true;
        } catch (err) {
          console.error("麥克風無法啟用:", err);
          return false;
        }
      }
      setSensitivity(mode) {
        if (mode === "ultra") { this.rmsThreshold = 0.003; this.threshold = 0.22; if (this.gainNode) this.gainNode.gain.value = 3.8; }
        else if (mode === "high") { this.rmsThreshold = 0.005; this.threshold = 0.18; if (this.gainNode) this.gainNode.gain.value = 2.6; }
        else if (mode === "medium") { this.rmsThreshold = 0.010; this.threshold = 0.15; if (this.gainNode) this.gainNode.gain.value = 1.8; }
        else { this.rmsThreshold = 0.020; this.threshold = 0.12; if (this.gainNode) this.gainNode.gain.value = 1.0; }
      }
      detect() {
        if (!this.analyser) return { pitch: null, note: null, rms: 0 };
        this.analyser.getFloatTimeDomainData(this.buffer);

        let sum = 0;
        for (let i = 0; i < this.buffer.length; i++) sum += this.buffer[i] * this.buffer[i];
        this.rms = Math.sqrt(sum / this.buffer.length);

        if (this.rms < this.rmsThreshold) {
          this.pitchHistory = [];
          this.currentPitch = null;
          return { pitch: null, note: null, rms: this.rms };
        }

        const half = Math.floor(this.buffer.length / 2);
        const diff = new Float32Array(half);
        diff[0] = 1;
        let runningSum = 0;
        for (let tau = 1; tau < half; tau++) {
          let d = 0;
          for (let i = 0; i < half; i++) {
            const delta = this.buffer[i] - this.buffer[i + tau];
            d += delta * delta;
          }
          runningSum += d;
          diff[tau] = runningSum > 0 ? (d * tau) / runningSum : 1;
        }

        let tauEstimate = -1;
        for (let tau = 2; tau < half; tau++) {
          if (diff[tau] < this.threshold) {
            while (tau + 1 < half && diff[tau + 1] < diff[tau]) tau++;
            tauEstimate = tau;
            break;
          }
        }
        if (tauEstimate === -1) return { pitch: null, note: null, rms: this.rms };

        let betterTau = tauEstimate;
        if (tauEstimate > 0 && tauEstimate < half - 1) {
          const s0 = diff[tauEstimate - 1], s1 = diff[tauEstimate], s2 = diff[tauEstimate + 1];
          betterTau = tauEstimate + (s2 - s0) / (2 * (2 * s1 - s2 - s0));
        }

        const rawPitch = this.audioCtx.sampleRate / betterTau;
        if (rawPitch < 65 || rawPitch > 1050) return { pitch: null, note: null, rms: this.rms };

        this.pitchHistory.push(rawPitch);
        if (this.pitchHistory.length > 3) this.pitchHistory.shift();
        const sorted = [...this.pitchHistory].sort((a, b) => a - b);
        const filtered = sorted[Math.floor(sorted.length / 2)];

        if (this.currentPitch) {
          this.currentPitch = this.currentPitch * 0.4 + filtered * 0.6;
        } else {
          this.currentPitch = filtered;
        }

        const midiNum = 69 + 12 * Math.log2(this.currentPitch / 440);
        const rounded = Math.round(midiNum);
        const names = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        const noteName = names[((rounded % 12) + 12) % 12] + (Math.floor(rounded / 12) - 1);

        return { pitch: this.currentPitch, midi: midiNum, roundedMidi: rounded, note: noteName, rms: this.rms };
      }
    }

    /* ==========================================================================
       3. 多音色 GM (General MIDI) 合成發聲引擎
       ========================================================================== */
    class GMAudioEngine {
      constructor() {
        this.ctx = null;
        this.isMuted = false;
        this.metronomeEnabled = false;
        this.metronomeVolume = 0.8; // 節拍器獨立音量 (0.0 ~ 1.5)
        this.noiseBuffer = null;
      }
      async init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (this.ctx.state === "suspended") await this.ctx.resume();
        if (!this.noiseBuffer && this.ctx) {
          // 建立 1 秒專用白噪聲緩衝區（供爵士鼓小鼓、鈸使用）
          const len = this.ctx.sampleRate;
          this.noiseBuffer = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
          const data = this.noiseBuffer.getChannelData(0);
          for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
        }
      }

      // 真正 GM 128 種樂器聲學物理模擬 (鋼琴、弦樂、吉他、貝斯、管樂、合成器、鼓組)
      playNote(midi, duration = 0.3, volume = 1.0, program = 0, isDrum = false) {
        if (!this.ctx || this.isMuted || volume <= 0) return;
        const now = this.ctx.currentTime;
        const masterOut = this.ctx.createGain();
        masterOut.gain.value = Math.min(1.5, volume * 0.75);
        masterOut.connect(this.ctx.destination);

        // 第 10 頻道打擊樂（Drums）
        if (isDrum) {
          this.playDrumSound(midi, now, masterOut);
          return;
        }

        const freq = 440 * Math.pow(2, (midi - 69) / 12);
        const pGroup = Math.floor(program / 8);

        switch (pGroup) {
          case 0: // 0-7: 鋼琴群 (Piano) - 雙振盪器豐富諧波
            this.synthPiano(freq, duration, now, masterOut);
            break;
          case 1: // 8-15: 鍵盤打擊樂 (Marimba, Glockenspiel, Celesta)
            this.synthMallet(freq, duration, now, masterOut);
            break;
          case 2: // 16-23: 風琴 (Organ)
            this.synthOrgan(freq, duration, now, masterOut);
            break;
          case 3: // 24-31: 吉他 (Acoustic / Electric Guitar)
            this.synthGuitar(freq, duration, now, masterOut);
            break;
          case 4: // 32-39: 貝斯 (Bass - Acoustic, Finger, Slap)
            this.synthBass(freq, duration, now, masterOut);
            break;
          case 5: // 40-47: 弦樂 (Violin, Cello, Harp)
          case 6: // 48-55: 弦樂合奏與合唱人聲 (String Ensemble, Choir)
            this.synthStrings(freq, duration, now, masterOut);
            break;
          case 7: // 56-63: 銅管 (Brass - Trumpet, Trombone, French Horn)
            this.synthBrass(freq, duration, now, masterOut);
            break;
          case 8: // 64-71: 簧樂 (Sax, Oboe, Clarinet)
          case 9: // 72-79: 木管 (Flute, Piccolo)
            this.synthReed(freq, duration, now, masterOut);
            break;
          case 10: // 80-87: 合成主音 (Synth Lead)
          case 11: // 88-95: 合成音色 (Synth Pad)
            this.synthPad(freq, duration, now, masterOut);
            break;
          default: // 其他音色
            this.synthDefault(freq, duration, now, masterOut);
            break;
        }
      }

      synthPiano(freq, duration, now, out) {
        const osc1 = this.ctx.createOscillator();
        const osc2 = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc1.type = "triangle";
        osc2.type = "sine";
        osc1.frequency.setValueAtTime(freq, now);
        osc2.frequency.setValueAtTime(freq * 2, now); // 高八度泛音
        g.gain.setValueAtTime(0.001, now);
        g.gain.linearRampToValueAtTime(0.8, now + 0.012);
        g.gain.exponentialRampToValueAtTime(0.001, now + Math.max(duration + 0.35, 0.5));
        osc1.connect(g);
        osc2.connect(g);
        g.connect(out);
        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + duration + 0.4);
        osc2.stop(now + duration + 0.4);
      }

      synthMallet(freq, duration, now, out) {
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, now);
        g.gain.setValueAtTime(0.9, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + Math.min(duration + 0.2, 0.8));
        osc.connect(g);
        g.connect(out);
        osc.start(now);
        osc.stop(now + 0.85);
      }

      synthOrgan(freq, duration, now, out) {
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, now);
        g.gain.setValueAtTime(0.01, now);
        g.gain.linearRampToValueAtTime(0.5, now + 0.03);
        g.gain.setValueAtTime(0.45, now + duration);
        g.gain.linearRampToValueAtTime(0.001, now + duration + 0.06);
        osc.connect(g);
        g.connect(out);
        osc.start(now);
        osc.stop(now + duration + 0.07);
      }

      synthGuitar(freq, duration, now, out) {
        const osc = this.ctx.createOscillator();
        const filter = this.ctx.createBiquadFilter();
        const g = this.ctx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(freq, now);
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(3200, now);
        filter.frequency.exponentialRampToValueAtTime(600, now + duration);
        g.gain.setValueAtTime(0.001, now);
        g.gain.linearRampToValueAtTime(0.7, now + 0.01);
        g.gain.exponentialRampToValueAtTime(0.001, now + Math.max(duration + 0.2, 0.4));
        osc.connect(filter);
        filter.connect(g);
        g.connect(out);
        osc.start(now);
        osc.stop(now + duration + 0.45);
      }

      synthBass(freq, duration, now, out) {
        const osc = this.ctx.createOscillator();
        const filter = this.ctx.createBiquadFilter();
        const g = this.ctx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(freq, now);
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(450, now);
        g.gain.setValueAtTime(0.001, now);
        g.gain.linearRampToValueAtTime(0.9, now + 0.015);
        g.gain.exponentialRampToValueAtTime(0.001, now + Math.max(duration + 0.1, 0.35));
        osc.connect(filter);
        filter.connect(g);
        g.connect(out);
        osc.start(now);
        osc.stop(now + duration + 0.38);
      }

      synthStrings(freq, duration, now, out) {
        const osc1 = this.ctx.createOscillator();
        const osc2 = this.ctx.createOscillator();
        const filter = this.ctx.createBiquadFilter();
        const g = this.ctx.createGain();
        osc1.type = "sawtooth";
        osc2.type = "sawtooth";
        osc1.frequency.setValueAtTime(freq, now);
        osc2.frequency.setValueAtTime(freq * 1.004, now); // 弦樂雙琴輕微 Detune 營造厚重空氣感
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(2000, now);
        g.gain.setValueAtTime(0.001, now);
        g.gain.linearRampToValueAtTime(0.45, now + 0.08);
        g.gain.setValueAtTime(0.4, now + duration);
        g.gain.linearRampToValueAtTime(0.001, now + duration + 0.2);
        osc1.connect(filter);
        osc2.connect(filter);
        filter.connect(g);
        g.connect(out);
        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + duration + 0.22);
        osc2.stop(now + duration + 0.22);
      }

      synthBrass(freq, duration, now, out) {
        const osc = this.ctx.createOscillator();
        const filter = this.ctx.createBiquadFilter();
        const g = this.ctx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(freq, now);
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(800, now);
        filter.frequency.linearRampToValueAtTime(2800, now + 0.06);
        g.gain.setValueAtTime(0.001, now);
        g.gain.linearRampToValueAtTime(0.6, now + 0.05);
        g.gain.setValueAtTime(0.4, now + duration);
        g.gain.linearRampToValueAtTime(0.001, now + duration + 0.1);
        osc.connect(filter);
        filter.connect(g);
        g.connect(out);
        osc.start(now);
        osc.stop(now + duration + 0.12);
      }

      synthReed(freq, duration, now, out) {
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, now);
        g.gain.setValueAtTime(0.001, now);
        g.gain.linearRampToValueAtTime(0.55, now + 0.04);
        g.gain.setValueAtTime(0.45, now + duration);
        g.gain.linearRampToValueAtTime(0.001, now + duration + 0.08);
        osc.connect(g);
        g.connect(out);
        osc.start(now);
        osc.stop(now + duration + 0.09);
      }

      synthPad(freq, duration, now, out) {
        const osc = this.ctx.createOscillator();
        const filter = this.ctx.createBiquadFilter();
        const g = this.ctx.createGain();
        osc.type = "square";
        osc.frequency.setValueAtTime(freq, now);
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(1400, now);
        g.gain.setValueAtTime(0.001, now);
        g.gain.linearRampToValueAtTime(0.4, now + 0.05);
        g.gain.exponentialRampToValueAtTime(0.001, now + duration + 0.15);
        osc.connect(filter);
        filter.connect(g);
        g.connect(out);
        osc.start(now);
        osc.stop(now + duration + 0.18);
      }

      synthDefault(freq, duration, now, out) {
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(freq, now);
        g.gain.setValueAtTime(0.001, now);
        g.gain.linearRampToValueAtTime(0.6, now + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, now + duration + 0.1);
        osc.connect(g);
        g.connect(out);
        osc.start(now);
        osc.stop(now + duration + 0.12);
      }

      playDrumSound(midi, now, out) {
        if (midi === 35 || midi === 36) { // Bass Drum 大鼓
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.frequency.setValueAtTime(130, now);
          osc.frequency.exponentialRampToValueAtTime(32, now + 0.12);
          g.gain.setValueAtTime(1.1, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
          osc.connect(g);
          g.connect(out);
          osc.start(now);
          osc.stop(now + 0.19);
        } else if (midi === 38 || midi === 40) { // Snare Drum 小鼓
          if (this.noiseBuffer) {
            const noise = this.ctx.createBufferSource();
            noise.buffer = this.noiseBuffer;
            const filter = this.ctx.createBiquadFilter();
            filter.type = "highpass";
            filter.frequency.value = 800;
            const g = this.ctx.createGain();
            g.gain.setValueAtTime(0.85, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
            noise.connect(filter);
            filter.connect(g);
            g.connect(out);
            noise.start(now);
          }
          const osc = this.ctx.createOscillator();
          const oscG = this.ctx.createGain();
          osc.frequency.setValueAtTime(200, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.08);
          oscG.gain.setValueAtTime(0.7, now);
          oscG.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
          osc.connect(oscG);
          oscG.connect(out);
          osc.start(now);
          osc.stop(now + 0.11);
        } else if (midi === 42 || midi === 44 || midi === 46) { // Hi-Hat 腳踏鈸
          if (this.noiseBuffer) {
            const noise = this.ctx.createBufferSource();
            noise.buffer = this.noiseBuffer;
            const filter = this.ctx.createBiquadFilter();
            filter.type = "highpass";
            filter.frequency.value = 6500;
            const g = this.ctx.createGain();
            g.gain.setValueAtTime(0.4, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + (midi === 46 ? 0.22 : 0.05));
            noise.connect(filter);
            filter.connect(g);
            g.connect(out);
            noise.start(now);
          }
        } else { // Toms / Cymbals
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.15);
          g.gain.setValueAtTime(0.65, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
          osc.connect(g);
          g.connect(out);
          osc.start(now);
          osc.stop(now + 0.19);
        }
      }

      playTick(isAccent = false) {
        if (!this.ctx || this.metronomeVolume <= 0) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(isAccent ? 1600 : 900, this.ctx.currentTime);
        const peakGain = Math.min(1.0, this.metronomeVolume * 0.8);
        gain.gain.setValueAtTime(peakGain, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.05);
      }
    }

    /* ==========================================================================
       4. 節拍量化與無縫填滿演算法 (Quantization & Legato Snap)
       ========================================================================== */
    function quantizeAndFillNotes(notes, bpm = 120) {
      if (!notes || notes.length === 0) return [];
      const beatSec = 60 / bpm;
      // 以十六分音符 (1/4 拍) 作為量化網格
      const grid = beatSec / 4;

      const processed = notes.map(n => ({
        midi: n.midi,
        start: Math.round(n.start / grid) * grid,
        dur: Math.max(grid, Math.round(n.dur / grid) * grid),
        lyric: n.lyric || ""
      }));

      processed.sort((a, b) => a.start - b.start);

      // 連續音符無縫吸附：若前後兩音相隔小於 1/2 拍，自動延長前音填滿空隙
      for (let i = 0; i < processed.length - 1; i++) {
        const cur = processed[i];
        const next = processed[i + 1];
        const end = cur.start + cur.dur;
        const gap = next.start - end;

        // 若不是大休止符，將前音長度拉滿至下一音開頭
        if (gap >= -0.01 && gap < beatSec * 0.45) {
          cur.dur = Math.max(cur.dur, next.start - cur.start);
        }
      }
      return processed;
    }

    // 內建標準拍格歌曲（填滿拍子且附帶歌詞與雙軌和聲）
    function buildTwinkleNotes(bpm = 100) {
      const b = 60 / bpm; // 1拍長度
      const seqLead = [
        { m: 60, b: 1, text: "一" }, { m: 60, b: 1, text: "閃" }, { m: 67, b: 1, text: "一" }, { m: 67, b: 1, text: "閃" },
        { m: 69, b: 1, text: "亮" }, { m: 69, b: 1, text: "晶" }, { m: 67, b: 2, text: "晶" },
        { m: 65, b: 1, text: "滿" }, { m: 65, b: 1, text: "天" }, { m: 64, b: 1, text: "都" }, { m: 64, b: 1, text: "是" },
        { m: 62, b: 1, text: "小" }, { m: 62, b: 1, text: "星" }, { m: 60, b: 2, text: "星" }
      ];
      const seqHarmony = [
        { m: 52, b: 2, text: "Woo~" }, { m: 55, b: 2, text: "Ah~" },
        { m: 57, b: 2, text: "La~" },  { m: 55, b: 2, text: "★" },
        { m: 53, b: 2, text: "Woo~" }, { m: 52, b: 2, text: "Ah~" },
        { m: 50, b: 2, text: "La~" },  { m: 48, b: 2, text: "★" }
      ];

      let curT = 0.5;
      const rawLead = [];
      seqLead.forEach(s => {
        rawLead.push({ midi: s.m, start: curT, dur: s.b * b, lyric: s.text });
        curT += s.b * b;
      });

      curT = 0.5;
      const rawHarmony = [];
      seqHarmony.forEach(s => {
        rawHarmony.push({ midi: s.m + 12, start: curT, dur: s.b * b, lyric: s.text });
        curT += s.b * b;
      });

      return {
        lead: quantizeAndFillNotes(rawLead, bpm),
        harmony: quantizeAndFillNotes(rawHarmony, bpm)
      };
    }

    function buildOdeNotes(bpm = 120) {
      const b = 60 / bpm;
      const seq = [
        { m: 64, b: 1, text: "歡" }, { m: 64, b: 1, text: "樂" }, { m: 65, b: 1, text: "女" }, { m: 67, b: 1, text: "神" },

    function buildBirthdayNotes(bpm = 110) {

    /* ==========================================================================
       5. 輕量高效 MIDI 解析器（支援 Running Status、Program Change 樂器、Channel 10 打擊樂與歌詞）
       ========================================================================== */
    class SimpleMidiParser {
      static decodeText(bytes) {
        // 嘗試 UTF-8 ➜ GBK/GB18030 ➜ Big5 ➜ ASCII 多重回退解碼，防止中文歌詞解析失敗
        const u8 = new Uint8Array(bytes);
        try {
          const dec = new TextDecoder("utf-8", { fatal: true });
          const res = dec.decode(u8).trim();
          if (res) return res;
        } catch {}
        try {
          const dec = new TextDecoder("gb18030");
          const res = dec.decode(u8).trim();
          if (res) return res;
        } catch {}
        try {
          const dec = new TextDecoder("big5");
          const res = dec.decode(u8).trim();
          if (res) return res;
        } catch {}
        let s = "";
        for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
        return s.trim();
      }

      static parse(arrayBuffer) {
        const view = new DataView(arrayBuffer);
        let offset = 0;
        function readStr(len) {
          let s = "";
          for (let i = 0; i < len; i++) s += String.fromCharCode(view.getUint8(offset++));
          return s;
        }
        if (readStr(4) !== "MThd") throw new Error("無效的 MIDI: 缺少 MThd 標頭");
        offset += 4; // 跳過 chunk 尺寸 (6)
        const formatType = view.getUint16(offset); offset += 2;
        const trackCount = view.getUint16(offset); offset += 2;
        const timeDivision = view.getUint16(offset); offset += 2;

        let detectedBpm = 120;
        let tempoEvents = []; // 保存全局動態拍速事件 { ticks, tempoMicroseconds }
        const rawTracks = [];
        const allGlobalLyrics = []; // 全局歌詞池：包含跨軌道的所有歌詞事件 { ticks, text }

        for (let t = 0; t < trackCount; t++) {
          if (offset >= view.byteLength) break;
          const chunkId = readStr(4);
          const chunkLen = view.getUint32(offset); offset += 4;
          if (chunkId !== "MTrk") { offset += chunkLen; continue; }
          const endTrack = offset + chunkLen;
          const trackEvents = [];
          let ticks = 0;
          let runningStatus = 0; // 支援 MIDI Running Status
          let trackName = `音軌 ${t + 1}`;
          let currentProgram = 0; // 預設 GM Grand Piano
          let isDrumChannel = false;

          while (offset < endTrack) {
            let delta = 0, byte = 0;
            do {
              byte = view.getUint8(offset++);
              delta = (delta << 7) | (byte & 0x7f);
            } while (byte & 0x80);
            ticks += delta;

            let status = view.getUint8(offset);
            if (status >= 0x80) {
              runningStatus = status;
              offset++;
            } else {
              status = runningStatus;
            }

            const eventType = status >> 4;
            const channel = status & 0x0f;
            if (channel === 9) isDrumChannel = true; // MIDI Channel 10 為標準爵士鼓軌

            if (status === 0xff) { // Meta 事件
              const metaType = view.getUint8(offset++);
              let metaLen = 0;
              do { byte = view.getUint8(offset++); metaLen = (metaLen << 7) | (byte & 0x7f); } while (byte & 0x80);

              const metaBytes = [];
              for (let k = 0; k < metaLen; k++) metaBytes.push(view.getUint8(offset + k));

              if (metaType === 0x03) { // 軌道名稱
                const nameStr = SimpleMidiParser.decodeText(metaBytes);
                if (nameStr) trackName = nameStr;
              } else if (metaType === 0x05 || metaType === 0x01) { // 歌詞 (0x05) 或文字 (0x01)
                const lyricStr = SimpleMidiParser.decodeText(metaBytes);
                if (lyricStr && !lyricStr.startsWith("@") && !lyricStr.startsWith("//")) {
                  // 存入全局歌詞池與本軌記錄
                  allGlobalLyrics.push({ ticks, text: lyricStr });
                }
              } else if (metaType === 0x51 && metaLen === 3) { // Set Tempo
                const t0 = metaBytes[0], t1 = metaBytes[1], t2 = metaBytes[2];
                const tempoUs = (t0 << 16) | (t1 << 8) | t2;
                tempoEvents.push({ ticks, tempoUs });
                if (!detectedBpm || detectedBpm === 120) {
                  detectedBpm = Math.round(60000000 / tempoUs);
                }
              }
              offset += metaLen;
            } else if (status === 0xf0 || status === 0xf7) { // SysEx
              let sysexLen = 0;
              do { byte = view.getUint8(offset++); sysexLen = (sysexLen << 7) | (byte & 0x7f); } while (byte & 0x80);
              offset += sysexLen;
            } else if (eventType === 0x0c) { // Program Change (GM 音色)
              currentProgram = view.getUint8(offset++);
            } else if (eventType === 0x0d) { // Aftertouch
              offset++;
            } else {
              const data1 = view.getUint8(offset++);
              const data2 = view.getUint8(offset++);

              if (eventType === 0x09 && data2 > 0) { // Note On
                trackEvents.push({ type: "noteOn", ticks, midi: data1 });
              } else if (eventType === 0x08 || (eventType === 0x09 && data2 === 0)) { // Note Off
                trackEvents.push({ type: "noteOff", ticks, midi: data1 });
              }
            }
          }

          rawTracks.push({
            name: trackName,
            program: currentProgram,
            isDrum: isDrumChannel,
            events: trackEvents
          });
        }

        // 計算時間戳轉換函式（支援動態 tempo 與多段速度）
        if (tempoEvents.length === 0) tempoEvents.push({ ticks: 0, tempoUs: 500000 });
        tempoEvents.sort((a, b) => a.ticks - b.ticks);

        const ticksToSeconds = (targetTicks) => {
          let totalSec = 0;
          let prevTicks = 0;
          let curTempoUs = 500000;
          for (let i = 0; i < tempoEvents.length; i++) {
            const ev = tempoEvents[i];
            if (targetTicks > ev.ticks) {
              const dTicks = ev.ticks - prevTicks;
              totalSec += (dTicks * curTempoUs) / ((timeDivision || 480) * 1000000);
              prevTicks = ev.ticks;
              curTempoUs = ev.tempoUs;
            } else {
              break;
            }
          }
          const remain = targetTicks - prevTicks;
          totalSec += (remain * curTempoUs) / ((timeDivision || 480) * 1000000);
          return totalSec;
        };

        // 將歌詞池全部換算為秒數，並依時間排序
        const lyricsWithSeconds = allGlobalLyrics.map(lyr => ({
          time: ticksToSeconds(lyr.ticks),
          text: lyr.text
        })).sort((a, b) => a.time - b.time);

        const parsedTracks = [];
        rawTracks.forEach((tObj, idx) => {
          const melody = [];
          const activeNotes = {}; // midi -> startSec

          tObj.events.forEach(ev => {
            const sec = ticksToSeconds(ev.ticks);
            if (ev.type === "noteOn") {
              if (activeNotes[ev.midi]) {
                const prevSec = activeNotes[ev.midi];
                const dur = Math.max(0.08, sec - prevSec);
                melody.push({ midi: ev.midi, start: prevSec, dur, lyric: "" });
              }
              activeNotes[ev.midi] = sec;
            } else if (ev.type === "noteOff" && activeNotes[ev.midi]) {
              const prevSec = activeNotes[ev.midi];
              const dur = Math.max(0.06, sec - prevSec);
              melody.push({ midi: ev.midi, start: prevSec, dur, lyric: "" });
              delete activeNotes[ev.midi];
            }
          });

          if (melody.length > 0) {
            melody.sort((a, b) => a.start - b.start);

            // ================= 歌詞時間容差吸附算法 =================
            // 只要歌詞時間在音符開始的 -0.25 秒到 +0.35 秒之內，就直接掛載到該音符
            const beatSec = 60 / detectedBpm;
            const tolerance = Math.max(0.2, beatSec * 0.4);

            melody.forEach(note => {
              // 尋找最近的歌詞
              let bestMatch = null;
              let minDiff = Infinity;
              for (let li = 0; li < lyricsWithSeconds.length; li++) {
                const lyr = lyricsWithSeconds[li];
                const diff = Math.abs(lyr.time - note.start);
                if (diff <= tolerance && diff < minDiff) {
                  minDiff = diff;
                  bestMatch = lyr;
                }
              }
              if (bestMatch) {
                note.lyric = bestMatch.text;
              }
            });

            const filled = quantizeAndFillNotes(melody, detectedBpm);
            const isFirst = (idx === 0);

            let finalName = tObj.name;
            if (tObj.isDrum) finalName = "🥁 Standard Drums";
            else if (!tObj.name || tObj.name.startsWith("音軌")) {
              finalName = GM_INSTRUMENT_NAMES[tObj.program] || `Track ${idx + 1}`;
            }

            parsedTracks.push({
              id: "tr_" + idx + "_" + Date.now(),
              name: finalName,
              program: tObj.program,
              isDrum: tObj.isDrum,
              role: isFirst ? "lead" : "accompaniment",
              visible: isFirst,
              volume: 1.0,
              muted: false,
              notes: filled
            });
          }
        });

        return { bpm: detectedBpm || 120, tracks: parsedTracks };
      }
    }
